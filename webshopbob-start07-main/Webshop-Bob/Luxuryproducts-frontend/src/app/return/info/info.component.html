<div class="row">
    <div class="col-xs-12">

          <div class="row">
                <div class="col-xs-12">

                    <h4 style="margin: 1.5rem">Make a return request</h4>

                    <div class="orderid" >

                        <div style="font-weight: bold;">
                            <p>Ordernumber: </p>
                        </div>
                        {{ order.id }}
                    </div>
                    <div class="datumOrder" >

                        <div style="font-weight: bold ">
                            <p> Productnumber: </p>
                        </div>
                        {{ productId }}
                    </div>

                    <form [formGroup]="returnForm" (ngSubmit)="onSubmit()" >
                     <div class="form-group">
                         <label for="secret">Options</label>
                        <select
                        id="secret"
                        class="form-control"
                        formControlName="reason">
                            <option value="broken">broken</option>
                            <option value="change of mind">change of mind</option>
                            <option value="wrong delivery">wrong delivery</option>
                            <option value="otherwise">otherwise</option>
                        </select>
                     </div>



                    <div class="form-group">
                        <label for="explanation">Explanation</label>
                        <input id="explanation"
                                type="text"
                               class="form-control"
                                formControlName="explanation"/>
                    </div>

                        <hr>
                        <button class="btn btn-primary" type="submit">Submit</button>

                        <button class="btn btn-danger" type="submit" (click)="onCancel()">Cancel</button>
                    </form>


                </div>


          </div>
    </div>
</div>
